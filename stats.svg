<svg width="480" height="300" viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub stats">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0118"/><stop offset="100%" stop-color="#2b0f4d"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"><animate attributeName="stop-color" values="#ec4899;#a855f7;#ec4899" dur="5s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#f472b6;#a855f7" dur="5s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    
  </defs>

  <rect x="1" y="1" width="478" height="298" rx="18" fill="url(#bg)" stroke="#5b2a8f" stroke-width="1.4"/>
  <text x="26" y="34" font-family="'Segoe UI',Verdana,sans-serif" font-size="16" font-weight="800" fill="#f5eaff">Khushi's GitHub Stats</text>
  <line x1="26" y1="44" x2="454" y2="44" stroke="#5b2a8f" stroke-opacity="0.5"/>

  <g transform="translate(388,142)">
    <circle r="62" fill="none" stroke="#241238" stroke-width="10"/>
    <circle r="62" fill="none" stroke="url(#grad)" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="389.6" stroke-dashoffset="389.6" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" values="389.6;54.5" dur="1.4s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.6 0.2 1"/>
    </circle>
    <text x="0" y="8" text-anchor="middle" font-family="'Segoe UI',Verdana,sans-serif" font-size="30" font-weight="800" fill="#f472b6" opacity="0" filter="url(#glow)">A+
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze"/>
    </text>
  </g>

  
    <g transform="translate(190,60)" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="230,60;230,60;190,60" keyTimes="0;0;1" dur="0.5s" begin="0.60s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" dur="0.5s" begin="0.60s" fill="freeze"/>
      <text x="0" y="0" font-family="'Segoe UI',Verdana,sans-serif" font-size="15" fill="#f472b6">★</text>
      <text x="24" y="0" font-family="'Segoe UI',Verdana,sans-serif" font-size="13.5" fill="#c9a8e8">Total Stars</text>
      <text x="255" y="0" text-anchor="end" font-family="'JetBrains Mono',Consolas,monospace" font-size="15" font-weight="700" fill="#f5eaff">128
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.90s" fill="freeze"/>
      </text>
    </g>
    <g transform="translate(190,106)" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="230,106;230,106;190,106" keyTimes="0;0;1" dur="0.5s" begin="0.75s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" dur="0.5s" begin="0.75s" fill="freeze"/>
      <text x="0" y="0" font-family="'Segoe UI',Verdana,sans-serif" font-size="15" fill="#f472b6">⌘</text>
      <text x="24" y="0" font-family="'Segoe UI',Verdana,sans-serif" font-size="13.5" fill="#c9a8e8">Total Commits</text>
      <text x="255" y="0" text-anchor="end" font-family="'JetBrains Mono',Consolas,monospace" font-size="15" font-weight="700" fill="#f5eaff">940
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.05s" fill="freeze"/>
      </text>
    </g>
    <g transform="translate(190,152)" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="230,152;230,152;190,152" keyTimes="0;0;1" dur="0.5s" begin="0.90s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" dur="0.5s" begin="0.90s" fill="freeze"/>
      <text x="0" y="0" font-family="'Segoe UI',Verdana,sans-serif" font-size="15" fill="#f472b6">⟲</text>
      <text x="24" y="0" font-family="'Segoe UI',Verdana,sans-serif" font-size="13.5" fill="#c9a8e8">PRs Merged</text>
      <text x="255" y="0" text-anchor="end" font-family="'JetBrains Mono',Consolas,monospace" font-size="15" font-weight="700" fill="#f5eaff">46
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.20s" fill="freeze"/>
      </text>
    </g>
    <g transform="translate(190,198)" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="230,198;230,198;190,198" keyTimes="0;0;1" dur="0.5s" begin="1.05s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0;1" dur="0.5s" begin="1.05s" fill="freeze"/>
      <text x="0" y="0" font-family="'Segoe UI',Verdana,sans-serif" font-size="15" fill="#f472b6">✓</text>
      <text x="24" y="0" font-family="'Segoe UI',Verdana,sans-serif" font-size="13.5" fill="#c9a8e8">Issues Closed</text>
      <text x="255" y="0" text-anchor="end" font-family="'JetBrains Mono',Consolas,monospace" font-size="15" font-weight="700" fill="#f5eaff">63
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.35s" fill="freeze"/>
      </text>
    </g>
</svg>